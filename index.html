<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launch Director 64</title>
<style>
:root{--bg:#dfe9f2;--fg:#14202e;--panel:#fff;--line:#14202e;--acc:#e8541e;--mut:#4b5b6c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--fg:#e8eef6;--panel:#17212f;--line:#e8eef6;--mut:#9fb0c3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1420;--fg:#e8eef6;--panel:#17212f;--line:#e8eef6;--mut:#9fb0c3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{min-height:100%;background-color:#000!important;background-image:radial-gradient(circle farthest-corner at 50% 50%,#444 0%,#000 100%)!important;background-repeat:no-repeat!important;background-attachment:fixed!important}
body{margin:0;min-height:100vh;background-color:#000!important;background-image:radial-gradient(circle farthest-corner at 50% 50%,#444 0%,#000 100%)!important;background-repeat:no-repeat!important;background-attachment:fixed!important;display:grid;place-items:center;color:var(--fg);font:16px/1.45 "Trebuchet MS",Verdana,sans-serif}

p.sub{margin:0 0 10px;color:var(--mut)}
#stage{position:relative;box-sizing:border-box;width:min(960px,calc(100vw - 24px),calc((100vh - 24px)*4/3));aspect-ratio:4/3;border:3px solid var(--line);background:#6fb7ff;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;inset:0;pointer-events:none;font:900 clamp(10px,2.4vw,17px)/1.3 "Courier New",monospace;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#hud .hl{position:absolute;left:2%;top:2%}#hud .hr{position:absolute;right:2%;top:2%;text-align:right}
#phase{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-size:clamp(14px,3.6vw,26px);color:#ffe14d}
#tgt.hit{color:#7dff7d}#cam{position:absolute;right:2%;bottom:3%;font-size:clamp(9px,2vw,14px)}#hud,#panel{display:none}#ui{position:absolute;left:0;top:0;pointer-events:none}.keys{margin:8px 0 0;color:var(--mut);font-size:14px}
#bar{position:relative;display:inline-block;width:clamp(60px,18vw,150px);height:1em;background:#222;border:2px solid #fff;vertical-align:middle}
#fill{position:absolute;left:0;top:0;bottom:0;background:#4dd2ff}#mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:#ff4d4d}
#panel{margin-top:10px;background:var(--panel);border:3px solid var(--line);padding:12px 14px}
.row{display:grid;grid-template-columns:minmax(120px,170px) 1fr 56px;gap:10px;align-items:center;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--acc);min-height:28px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 10px}
button{font:900 16px "Arial Black",Impact,sans-serif;background:var(--acc);color:#fff;border:3px solid var(--line);padding:10px 18px;cursor:pointer;min-height:44px}
button.alt{background:var(--panel);color:var(--fg)}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #ffd000;outline-offset:2px}

.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8px 0 12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.mini{padding:6px 12px;font-size:13px;min-height:36px}
</style></head><body><main>
<div id="stage"><canvas id="c"></canvas><canvas id="ui" width="320" height="240"></canvas>
<div id="hud"><div class="hl">ALT <b id="alt">0</b> m<br>SPD <b id="spd">0</b> m/s<br><span id="tgt">TARGET 5,000 m</span></div>
<div class="hr">FUEL <span id="bar"><i id="fill"></i><u id="mk"></u></span> <b id="fp">100</b>%</div>
<div id="phase">PRE-LAUNCH</div><div id="cam"></div></div></div>
<section id="panel">
<div id="setup">
<div class="row"><label for="p0">Fuel load</label><input id="p0" type="range" min="0" max="100" value="0"><b id="p0v">0%</b></div>
<div class="row"><label for="pm">MECO at fuel</label><input id="pm" type="range" min="0" max="90" value="0"><b id="pmv">0%</b></div>
<p class="hint">The engine cuts off when fuel drops to the MECO level. Cut too early and you won’t reach 5,000 m. Cut too late and the landing burn runs dry.</p>
<div class="btns"><button id="go">Launch</button></div></div>
<div id="fly" hidden></div>
<div id="res" hidden><h2 id="rt"></h2><div class="stats" id="rs"></div><p id="rh" class="hint"></p><div class="btns"><button id="again">Adjust and retry</button></div></div>
</section></main>
<script src="three.min.js"></script>
<script>
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('en-US');
const P={G:9.81,F:2200,MD:40,MF:60,B:2.6,VT:140,LB:1200,TARGET:5000,SOFT:6},DT=0.02;let K=P.G/(P.VT*P.VT);
const S={mode:'title',p0:0,pm:0,ts:2,ang:0,endT:0,lv:1,eff:1,clk:0};let s;
function reset(){s={h:0,v:0,t:0,p:S.p0,apo:0,ph:0,thr:0,th:0,lb:0,t5:0,done:false,td:0,yaw:0,rx:0,rz:0,dsc:0,xA:0,zA:0,hA:1,rcsN:0,rcsB:0,rcsS:0}}
function step(){
  const m=P.MD+P.MF*s.p/100;s.thr=0;
  if(s.ph==0){if(s.p>S.pm)s.thr=1;else s.ph=1}
  if(s.ph>=1&&s.v<0&&s.h<P.LB&&s.p>0){const a=P.F/m-P.G,vt=Math.max(2,Math.sqrt(1.2*a*Math.max(s.h,0)));if(-s.v>vt){s.thr=1;s.lb=1}}
  const acc=s.thr*P.F/m-P.G-K*s.v*Math.abs(s.v);
  s.v+=acc*DT;s.h+=s.v*DT;s.t+=DT;
  if(s.thr)s.p=Math.max(0,s.p-P.B*DT);
  if(s.h>s.apo)s.apo=s.h;
  if(s.h<=0&&s.v<=0&&s.t>1){s.h=0;s.td=-s.v;s.done=true}
}
// ---- scene (rendered at 320x240 and upscaled for the N64 look)
const W=320,H=240,T=THREE;
const rd=new T.WebGLRenderer({canvas:$('c'),antialias:false,logarithmicDepthBuffer:true});rd.setPixelRatio(1);rd.setSize(W,H,false);
const sc=new T.Scene(),sky=new T.Color(0x6fb7ff),c1=new T.Color(0x6fb7ff),c2=new T.Color(0x070b24);
sc.background=sky.clone();sc.fog=new T.Fog(0x6fb7ff,2500,35000);
const cam=new T.PerspectiveCamera(50,W/H,2,40000);
const AL=new T.AmbientLight(0xbfd0ff,0.75),sun=new T.DirectionalLight(0xfff2d0,0.9);sun.position.set(200,400,150);sc.add(AL,sun);
const TINT=new T.Color(1,1,1),WORLD=new T.Group();sc.add(WORLD);
const mat=c=>new T.MeshPhongMaterial({color:new T.Color(c).multiply(TINT),flatShading:true,shininess:0});
function add(g,c,x,y,z,par){const m=new T.Mesh(g,mat(c));m.position.set(x,y,z);(par||WORLD).add(m);return m}
const po=(m,u)=>{m.material.polygonOffset=true;m.material.polygonOffsetFactor=-1;m.material.polygonOffsetUnits=-u;return m};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
// ---- level table: [0]=title sunrise, 1-4 = levels (acceleration, target, cloud ceiling and sky-dark altitude double each level)
const LV=[
 {name:'',ts:2,cloudTop:4600,dark:8000,c1:0xff9566,c2:0x6fb7ff,fog:[2500,35000],far:40000,amb:[0xffc0a0,.7],sun:[0xffb890,1,[300,60,200]],sea:0x3a8fb0,sc:1},
 {name:'STARHOPPER',ts:2,cloudTop:4600,dark:8000,c1:0x6fb7ff,c2:0x070b24,fog:[2500,35000],far:40000,amb:[0xbfd0ff,.75],sun:[0xfff2d0,.9,[200,400,150]],sea:0x2a8fb0,sc:1,p:{F:2200,B:3.0,VT:140,LB:1200,TARGET:5000,SOFT:6}},
 {name:'STARSHIP',ts:2,cloudTop:9200,dark:16000,c1:0xff9a5a,c2:0x1a0b2e,fog:[5000,70000],far:80000,amb:[0xffb09a,.65],sun:[0xff9a50,1,[400,70,150]],sea:0x2f6f9c,sc:2,isl:40,p:{F:4400,B:4.2,VT:200,LB:1200,TARGET:10000,SOFT:5}},
 {name:'FALCON 9',ts:2,cloudTop:18400,dark:32000,c1:0x0b1030,c2:0x01020a,fog:[10000,140000],far:160000,amb:[0x5a6a9a,.5],sun:[0xaab8ff,.45,[-200,300,150]],sea:0x2a8fb0,sc:4,isl:40,night:1,tint:[.55,.62,.8],p:{F:4400,B:3.0,VT:280,LB:1200,TARGET:20000,SOFT:4}},
 {name:'SATURN V',ts:2,cloudTop:36800,dark:64000,c1:0x7d8892,c2:0x2a3038,fog:[600,200000],far:300000,amb:[0xb8c4d0,.7],sun:[0xc8d0d8,.5,[100,400,100]],sea:0x4a6a78,sc:8,isl:90,rain:1,cloud:0x8e98a2,p:{F:4400,B:2.2,VT:400,LB:1200,TARGET:40000,SOFT:3}}];
let LVc=LV[1],lvN=1,RI=0,cs=1,ctr=11,zm=1;const RHT=[25,25,28,41.5,48.5],RW=[4.5,4.5,3.6,2.6,3.75];
function buildWorld(n){const L=LV[n],k=L.sc;while(WORLD.children.length)WORLD.remove(WORLD.children[0]);seed=7;const occ=[[0,0,800]];
  add(new T.PlaneGeometry(200000*k,200000*k).rotateX(-Math.PI/2),L.sea,0,-6,0);
  po(add(new T.CylinderGeometry(740,760,3,14),0xe0c98a,0,-4,0),2);po(add(new T.CylinderGeometry(700,720,3,14),0x5ea84a,0,-2.1,0),4);
  po(add(new T.CylinderGeometry(26,26,2,16),0x777f88,0,-0.8,0),6);po(add(new T.CylinderGeometry(16,16,1.4,16),0x3b4350,0,0.5,0),8);
  [[160,0,40,60,90],[-200,60,60,40,50],[230,-120,30,50,30],[-150,-180,34,34,26],[40,260,50,70,20]].forEach(b=>add(new T.BoxGeometry(b[2],b[4],b[3]),0xc9d3dd,b[0],b[4]/2-.6,b[1]));
  for(let i=0;i<40;i++){const a=rnd()*6.28,r=120+rnd()*540;add(new T.ConeGeometry(8+rnd()*8,26+rnd()*20,6),0x2f7d3a,Math.cos(a)*r,14,Math.sin(a)*r)}
  for(let i=0;i<14;i++){const a=rnd()*6.28,r=1800+rnd()*5000,hh=120+rnd()*380;add(new T.ConeGeometry(hh*1.3,hh,6),0x4f9a46,Math.cos(a)*r,hh/2-2,Math.sin(a)*r);occ.push([Math.cos(a)*r,Math.sin(a)*r,hh*1.3+100])}
  for(let i=0;i<(L.isl||0);i++){const R0=i<40?30000:70000;let ok=false,x=0,z=0,q=0,hs=0;
    for(let t=0;t<60&&!ok;t++){const a=rnd()*6.28,r=2500+rnd()*R0;q=300+rnd()*2200;hs=rnd();x=Math.cos(a)*r;z=Math.sin(a)*r;ok=occ.every(o=>Math.hypot(x-o[0],z-o[1])>q*1.1+o[2]+250)}
    if(!ok)continue;occ.push([x,z,q*1.1]);
    po(add(new T.CylinderGeometry(q*1.08,q*1.1,3,10),0xe0c98a,x,-4,z),2);po(add(new T.CylinderGeometry(q,q*1.03,3,10),0x5ea84a,x,-2.1,z),4);
    if(hs>.35){const ch=q*(.15+hs*.35);add(new T.ConeGeometry(q*.45,ch,7),0x4f9a46,x+q*.1,ch/2-1,z)}}
  const nc=50+25*(n>0?n-1:0),sp=9000*Math.sqrt(k),z=1+.35*Math.log2(k);
  for(let i=0;i<nc;i++){const c=add(new T.IcosahedronGeometry(1,0),L.cloud||0xffffff,(rnd()-.5)*sp,600+rnd()*(L.cloudTop-600),(rnd()-.5)*sp);c.scale.set((90+rnd()*120)*z,26*z,(60+rnd()*80)*z)}
  if(L.night){const N=900,pa=new Float32Array(N*3);for(let i=0;i<N;i++){pa[i*3]=(rnd()-.5)*90000;pa[i*3+1]=L.cloudTop+rnd()*90000;pa[i*3+2]=(rnd()-.5)*90000}
    const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pa,3));const st=new T.Points(g,new T.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false}));st.frustumCulled=false;WORLD.add(st);
    const mo=new T.Mesh(new T.SphereGeometry(3500,12,8),new T.MeshBasicMaterial({color:0xf4f0d8,fog:false}));mo.position.set(-45000,32000,-70000);WORLD.add(mo);
    const ha=new T.Mesh(new T.SphereGeometry(4600,12,8),new T.MeshBasicMaterial({color:0xcfd8ff,transparent:true,opacity:.18,fog:false,depthWrite:false}));ha.position.copy(mo.position);WORLD.add(ha)}}
// ---- rain (level 4): 300 streaks wrapped around the camera
const RN=300,rp=new Float32Array(RN*6),rb=[];for(let i=0;i<RN;i++)rb.push([rnd()*200,rnd()*200,rnd()*200]);
const rg=new T.BufferGeometry();rg.setAttribute('position',new T.BufferAttribute(rp,3));
const RAIN=new T.LineSegments(rg,new T.LineBasicMaterial({color:0xaec4d8,transparent:true,opacity:.6,fog:false}));RAIN.frustumCulled=false;RAIN.visible=false;sc.add(RAIN);
function updRain(){if(!RAIN.visible)return;const t=performance.now()/1000,c=cam.position,w=(v,o)=>(((v-o)%200)+200)%200-100+o;
  for(let i=0;i<RN;i++){const b=rb[i],x=w(b[0],c.x),y=w(b[1]-t*80,c.y),z=w(b[2],c.z);rp.set([x,y,z,x+.3,y+5,z],i*6)}
  rg.attributes.position.needsUpdate=true;RAIN.material.opacity=.6*RI}
// ---- rockets: Starhopper, Starship, Falcon 9, Saturn V (low-poly, flat colours)
const R=new T.Group();sc.add(R);const FL=new T.Group();FL.position.y=1;R.add(FL);let fw=1,fh=1,BELLS=[],FLAPS=[],FINS=[];
function buildRocket(n){BELLS=[];FLAPS=[];FINS=[];R.children.slice().forEach(c=>{if(c!==FL)R.remove(c)});FL.children.slice().forEach(c=>FL.remove(c));
  const W=0xe9edf2,SV=0xc5ccd4,K2=0x1c2026,GR=0x8a949e,CY=(a,b,h,s)=>new T.CylinderGeometry(a,b,h,s||12),CN=(r,h,s)=>new T.ConeGeometry(r,h,s||12),BX=(a,b,c)=>new T.BoxGeometry(a,b,c);
  const bell=(r,h,x,z)=>{const m=add(CN(r,h,8).rotateX(Math.PI),K2,x,1.2,z,R);BELLS.push(m);return m};
  const legs=(k,x,col,w)=>{for(let i=0;i<k;i++){const g=new T.Group();g.rotation.y=i*6.2832/k;R.add(g);const l=add(BX(w,6,w),col,x,2.9,0,g);l.rotation.z=-.35;add(BX(1.8,.4,1.8),col,x+.9,.2,0,g)}};
  let rs=1;fw=1;fh=1;
  if(n==1){add(CY(4.5,4.5,16,10),0xd7dde3,0,10,0,R);add(CN(4.5,7,10),0xd7dde3,0,21.5,0,R);add(CY(4.7,4.7,1.4,10),0x2d3640,0,3,0,R);bell(2.2,3,0,0);legs(3,5.2,GR,.8)}
  else if(n==2){rs=.8;fw=1.15;fh=1.2;add(CY(4.5,4.5,24),SV,0,14,0,R);add(new T.CylinderGeometry(4.6,4.6,23.2,12,1,false,-1.57,3.14),K2,0,14.2,0,R);add(CN(4.5,9),SV,0,30.5,0,R);
    [-1,1].forEach(s2=>{[[2.5,.4,5,24.5,5.2,0],[3.2,.5,8,5,5.6,1]].forEach(f=>{const g=new T.Group();g.position.set(s2*(f[4]-1),f[3],0);R.add(g);add(BX(f[0],f[1],f[2]),GR,s2,0,0,g);FLAPS.push({g,s:s2,f:f[5]})})});add(CY(4.7,4.7,1.4,10),K2,0,3,0,R);bell(2.2,3,0,0);legs(3,5.2,GR,.8)}
  else if(n==3){rs=.865;fw=.85;fh=1.5;add(CY(3,3,26),W,0,15,0,R);add(CY(3.05,3.05,3),K2,0,29.5,0,R);add(CY(3,3,10),W,0,36,0,R);add(CN(3,7),W,0,44.5,0,R);add(CY(3.1,3.1,1.4),K2,0,3,0,R);bell(2,3,0,0);
    [[3.5,0],[-3.5,0],[0,3.5],[0,-3.5]].forEach(q=>{const g=new T.Group();g.position.set(q[0],28,q[1]);R.add(g);add(BX(1.6,2,.3),K2,0,0,0,g);FINS.push({g})});legs(4,3.8,K2,.5)}
  else{rs=.75;fw=1.1;fh=2;add(CY(5,5,22,14),W,0,13,0,R);add(CY(5.05,5.05,3,14),K2,0,8,0,R);add(CY(5.05,5.05,3,14),K2,0,18,0,R);add(CY(5,5,14,14),W,0,31,0,R);add(CY(5.05,5.05,2,14),K2,0,28,0,R);
    add(CY(3.6,5,2),K2,0,39,0,R);add(CY(3.6,3.6,9),W,0,44.5,0,R);add(CY(3.65,3.65,1.5),K2,0,50,0,R);add(CN(3,5,10),W,0,53,0,R);add(CY(.3,.3,7,6),GR,0,59,0,R);add(CN(.7,1.5,6),K2,0,63.5,0,R);
    add(CY(5.2,5.2,1.4,14),K2,0,3,0,R);[[0,0],[2.6,0],[-2.6,0],[0,2.6],[0,-2.6]].forEach(q=>bell(1.3,2.5,q[0],q[1]));
    [-1,1].forEach(s2=>{add(BX(6,8,.5),K2,s2*6.5,5.5,0,R);add(BX(.5,8,6),K2,0,5.5,s2*6.5,R)})}
  R.scale.setScalar(rs);for(const f of [add(CN(2.4,9,8).rotateX(Math.PI),0xff9a1f,0,-4.5,0,FL),add(CN(1.2,5,8).rotateX(Math.PI),0xfff07a,0,-2.5,0,FL)]){f.material.transparent=true;f.material.opacity=.7;f.material.depthWrite=false}}
function setLevel(n){const L=LV[n];LVc=L;lvN=n;if(n>0){Object.assign(P,L.p);K=P.G/(P.VT*P.VT);S.ts=L.ts}
  c1.set(L.c1);c2.set(L.c2);sc.fog.near=L.fog[0];sc.fog.far=L.fog[1];cam.far=L.far;cam.updateProjectionMatrix();
  AL.color.set(L.amb[0]);AL.intensity=L.amb[1];sun.color.set(L.sun[0]);sun.intensity=L.sun[1];sun.position.set(...L.sun[2]);
  cs=RHT[n]/25;ctr=RHT[n]*.45;zm=n>=2?1.33:1;TINT.setRGB(...(L.tint||[1,1,1]));buildWorld(n);buildRocket(n||1);R.visible=true;RAIN.visible=!!L.rain;
  puffs.forEach(q=>{q.l=0;q.m.visible=false})}
// puffs and explosion bits
const puffs=[];for(let i=0;i<90;i++){const m=add(new T.IcosahedronGeometry(1,0),0xdddddd,0,-999,0,sc);m.visible=false;puffs.push({m,l:0,v:new T.Vector3(),g:1})}
let pi=0;function puff(x,y,z,vx,vy,vz,col,life,size){const q=puffs[pi++%puffs.length];q.m.position.set(x,y,z);q.m.material.color.setHex(col);{const f=col==0xff8a1f||col==0xfff07a,M=q.m.material;M.transparent=f;M.opacity=f?.7:1;M.depthWrite=!f;M.needsUpdate=true}q.v.set(vx,vy,vz);q.l=q.L=life;q.sz=size;q.m.visible=true}
function boom(){for(let i=0;i<40;i++)puff(0,s.h+8,0,(rnd()-.5)*60,rnd()*50,(rnd()-.5)*60,i%3?0xff8a1f:0xfff07a,2.4,6+rnd()*8)}
// loop
function phaseText(){if(S.mode=='setup')return 'PRE-LAUNCH';if(s.done)return s.td<P.SOFT?'TOUCHDOWN':'IMPACT';if(s.ph==0)return 'LAUNCH';if(s.lb)return s.p<=0?'OUT OF FUEL':'LANDING BURN';return s.v>0?'MECO: COASTING':'DESCENT'}
// camera director: chase first, then onboard cams, then a fixed pad camera for the landing
const PAD=new T.Vector3(95,3,140),LT=new T.Vector3(),TM=new T.Vector3();let padCam=false;
function aim(a,d,sh,hh){
